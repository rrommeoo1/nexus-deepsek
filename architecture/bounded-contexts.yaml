schema_version: 1
architecture_id: nexus-monorepo-boundaries
default_policy: deny
cross_context_access: public_contract_or_event_only

zones:
  - id: apps
    root: apps/
    purpose: deployable_user_interfaces
  - id: services
    root: services/
    purpose: deployable_application_and_protocol_processes
  - id: packages
    root: packages/
    purpose: versioned_domain_and_shared_libraries
  - id: contracts
    root: contracts/
    purpose: multiversx_rust_smart_contracts

contexts:
  - id: architecture_governance
    bounded_context: ArchitectureGovernance
    owner: A02
    public_api_path: packages/architecture-api
    import_specifier: "@nexus/architecture"
    allowed_imports: []
    publish_events: []
    consume_events: []
    data_access: [INTERNAL_CONFIG]
  - id: platform
    bounded_context: PlatformDevEx
    owner: A10
    allowed_imports: [architecture_governance]
    publish_events: []
    consume_events: []
    data_access: [INTERNAL_CONFIG]
  - id: contract_registry
    bounded_context: ContractRegistry
    owner: A13
    public_api_path: packages/contracts/api
    import_specifier: "@nexus/contracts"
    allowed_imports: [architecture_governance]
    publish_events: [contract.schema.changed]
    consume_events: []
    data_access: [PUBLIC, INTERNAL_CONFIG]
  - id: observability
    bounded_context: Observability
    owner: A15
    public_api_path: packages/observability/api
    import_specifier: "@nexus/observability"
    allowed_imports: [contract_registry]
    publish_events: [observability.signal.recorded]
    consume_events: []
    data_access: [TELEMETRY_REDACTED]
  - id: identity
    bounded_context: IdentityWallet
    owner: A11
    public_api_path: packages/identity/api
    import_specifier: "@nexus/identity"
    allowed_imports: [contract_registry]
    publish_events: [identity.account.ready, identity.capability.revoked]
    consume_events: [contract.schema.changed]
    data_access: [KYC_RAW]
  - id: profile_core
    bounded_context: ProfileCore
    owner: A12
    public_api_path: packages/profile/api
    import_specifier: "@nexus/profile"
    allowed_imports: [identity, contract_registry]
    publish_events: [profile.context.changed, profile.visibility.changed]
    consume_events: [identity.account.ready, identity.capability.revoked]
    data_access: [PUBLIC, ACCOUNT_PRIVATE]
  - id: core_api_shell
    bounded_context: CoreApiShell
    owner: A12
    allowed_imports: [identity, profile_core, moderation, messaging, media, recommendations, social, commerce, dating, live, agent_network, chain_integration, contract_registry, observability]
    publish_events: []
    consume_events: []
    data_access: [INTERNAL_CONFIG]
  - id: chain_actions
    bounded_context: ChainActions
    owner: A20
    public_api_path: packages/chain-actions-api
    import_specifier: "@nexus/chain-actions"
    allowed_imports: [contract_registry]
    publish_events: []
    consume_events: []
    data_access: [CHAIN_COMMITMENT]
  - id: chain_escrow
    bounded_context: ChainEscrow
    owner: A21
    public_api_path: packages/chain-escrow-api
    import_specifier: "@nexus/chain-escrow"
    allowed_imports: [contract_registry]
    publish_events: []
    consume_events: []
    data_access: [FINANCIAL]
  - id: chain_integration
    bounded_context: ChainIntegration
    owner: A22
    public_api_path: packages/chain-adapter/api
    import_specifier: "@nexus/chain"
    allowed_imports: [chain_actions, chain_escrow, contract_registry]
    publish_events: [chain.action.executed, chain.escrow.settled, chain.runtime.changed]
    consume_events: [contract.schema.changed]
    data_access: [CHAIN_COMMITMENT, FINANCIAL]
  - id: moderation
    bounded_context: ModerationSafety
    owner: A32
    public_api_path: packages/moderation/api
    import_specifier: "@nexus/moderation"
    allowed_imports: [profile_core, contract_registry]
    publish_events: [moderation.decision.changed, moderation.emergency.contained]
    consume_events: [profile.context.changed]
    data_access: [PUBLIC, SAFETY_EVIDENCE]
  - id: messaging
    bounded_context: Messaging
