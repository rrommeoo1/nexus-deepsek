sensitive_data_rules:
  - data_class: ACCOUNT_PRIVATE
    owner_context: profile_core
    allowed_contexts: [profile_core]
    authorized_projection_consumers: [mobile_shell, public_web_shell, admin_shell]
    projection_contract: "@nexus/profile#authorized_projection"
    projection_data_class: ACCOUNT_AUTHORIZED_PROJECTION
    transport: encrypted_purpose_bound
    purpose: active_profile_rendering_and_authorized_support
    authorized_audiences: [self_active_profile, policy_authorized_operator]
    event_payload: deny
  - data_class: ACCOUNT_AUTHORIZED_PROJECTION
    owner_context: profile_core
    allowed_contexts: [mobile_shell, public_web_shell, admin_shell]
    transport: encrypted_purpose_bound_projection
    purpose: active_profile_rendering_and_authorized_support
    authorized_audiences: [self_active_profile, policy_authorized_operator]
    event_payload: deny
  - data_class: DATING_SENSITIVE
    allowed_contexts: [dating]
    transport: ciphertext_or_on_device
  - data_class: CHILD_DATA
    allowed_contexts: [kids]
    transport: kids_tenant_only
  - data_class: MESSAGE_PLAINTEXT_ON_DEVICE
    allowed_contexts: [messaging, mobile_shell]
    transport: on_device_only
  - data_class: KYC_RAW
    allowed_contexts: [identity]
    transport: provider_vault_only
  - data_class: WELLNESS_PRIVATE
    allowed_contexts: [music_grow]
    transport: encrypted_purpose_bound
  - data_class: LOCATION_PRECISE_EPHEMERAL
    allowed_contexts: [commerce]
    transport: encrypted_ttl
  - data_class: SAFETY_EVIDENCE
    allowed_contexts: [moderation, admin_shell]
    transport: evidence_vault_only

event_policy:
  default: deny
  schema_owner: A13
  payload_mode: identifiers_commitments_or_ciphertext
  forbidden_payload_data_classes: [ACCOUNT_PRIVATE, ACCOUNT_AUTHORIZED_PROJECTION, DATING_SENSITIVE, CHILD_DATA, MESSAGE_PLAINTEXT_ON_DEVICE, KYC_RAW, WELLNESS_PRIVATE, LOCATION_PRECISE_EPHEMERAL, SAFETY_EVIDENCE]
  unknown_event_result: deny

