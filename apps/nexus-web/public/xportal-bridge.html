<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexus · xPortal</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; min-height: 100%; background: #04120b; color: #eaf6ff; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { padding: 22px 20px; }
  h1 { margin: 0 0 10px; font-size: 17px; letter-spacing: .02em; }
  p { margin: 0 0 10px; color: #a9c2b6; font-size: 13px; }
  #state { margin-top: 14px; padding: 12px 14px; border-radius: 14px; border: 1px solid rgba(139, 208, 74, .32); color: #d8f3c2; font-size: 13px; }
  #state.error { border-color: rgba(255, 120, 120, .5); color: #ffb3b3; }
  #qr { margin: 14px auto 0; width: 132px; padding: 8px; border-radius: 12px; background: #eaf6ff; }
  #qr svg { display: block; width: 100%; height: auto; }
  code { font-family: ui-monospace, monospace; font-size: 11px; word-break: break-all; color: #8fa3b4; }
</style>
</head>
<body>
<main>
  <h1>Conectarea xPortal</h1>
  <p>Această pagină vorbește cu xPortal prin WalletConnect. Telefonul deschide xPortal pentru aprobare și semnătură; pagina nu ține nicio cheie.</p>
  <div id="state" role="status" aria-live="polite">Pregătesc conexiunea…</div>
  <div id="qr" hidden aria-hidden="true"></div>
  <p id="detail"></p>
</main>
<script type="module" src="/xportal-bridge.js"></script>
</body>
</html>
