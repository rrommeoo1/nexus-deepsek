schema_version: 1
program: Nexus
cycle: thin_verticals_after_p0_contracts
default_status: blocked

tasks:
  - task_id: NX-ECON-001
    record_kind: epic
    lane: P1_DEMO_CRITICAL
    milestone_order: 0
    child_packets: [NX-ECON-P01]
    title: Sustainable creator, action and node economy
    objective: Keep ordinary engagement usable while optional support, bounded creator pools and verified node services create auditable revenue and payouts.
    owner_agent: A43
    peer_reviewers: [A20, A16, A32]
    control_reviewers: [C03, C05, C08, C10]
    status: done
    risk_class: T0
    timebox_agent_days: null
    normative_refs: [docs/07-tokenomics.md, docs/10-supernova-economics-compliance.md, docs/17-decentralized-node-network.md, docs/18-creator-node-adult-economy.md]
    depends_on: [NX-QA-001, NX-CHAIN-001, NX-CHAIN-002, NX-OBS-001]
    acceptance_tests:
      - Free engagement never creates a fixed direct payout and optional paid support remains a separate explicit action.
      - Creator and node payout pools are capped by realized eligible revenue and reconcile to settlement receipts.
      - Organic, paid-support and promoted rankings remain separate and exclude SYSTEM_TEST and invalid traffic.
      - Adult monetization is a separate default-deny web surface with age, identity, consent, territory and pre-publication gates.
    evidence_required: [economic_model, stress_simulation, payout_invariants, country_and_store_gate_matrix]

  - task_id: NX-ECON-P01
    record_kind: task_packet
    parent_epic: NX-ECON-001
    lane: P1_DEMO_CRITICAL
    milestone_order: 0
    title: Free-like paid-support and useful-node economics contract
    objective: Version the formulas, caps, ranking separation and settlement boundaries for free on-chain engagement, creator support and useful node work.
    owner_agent: A43
    peer_reviewers: [A20, A16, A32]
    control_reviewers: [C03, C05, C08, C10]
    status: done
    risk_class: T0
    timebox_agent_days: 3
    normative_refs: [docs/07-tokenomics.md, docs/17-decentralized-node-network.md, docs/18-creator-node-adult-economy.md]
    depends_on: [NX-QA-001, NX-CHAIN-001, NX-CHAIN-002, NX-OBS-001]
    acceptance_tests:
      - Like and comment can be sponsored or queued without becoming pay-to-engage and each terminal action still maps to one transaction.
      - The support button exposes the full split before signature and cannot alter organic reach.
      - Qualified creator rewards and node rewards are computed from fixed epoch budgets with anti-Sybil caps and exact conservation.
      - Stress cases for zero revenue, gas spikes, fraud, chargebacks and node concentration fail closed without negative treasury balance.
    evidence_required: [versioned_economic_contract, deterministic_simulation, conservation_report, privacy_and_legal_boundaries]

  - task_id: NX-PAY-001
    record_kind: epic
    lane: P1_DEMO_CRITICAL
    milestone_order: 1
    child_packets: [NX-PAY-P01]
    title: Nexus Pay instant username payments
    objective: A user sends an allowlisted stablecoin or EGLD to a verified username alias through a non-custodial wallet, while xMoney provides the primary merchant, payment-link, refund and regulated-rail adapter where supported.
    owner_agent: A21
    peer_reviewers: [A11, A13, A20]
    control_reviewers: [C02, C03, C05, C10]
    status: done
    risk_class: T0
    timebox_agent_days: null
    normative_refs: [docs/02-smart-contracts.md, docs/04-security-compliance.md, docs/10-supernova-economics-compliance.md, docs/19-username-payments.md]
    depends_on: [NX-ECON-001, NX-AUTH-001, NX-CHAIN-001, NX-CHAIN-002, NX-OBS-001]
    acceptance_tests:
      - Username resolution is versioned and bound to the exact address token amount network and expiry shown before signature.
      - Homoglyph stale alias recipient substitution replay and wrong-network transfers fail closed.
      - Pending ordered executed and failed states are never presented as the same finality state.
      - Stablecoin allowlist sanctions country limits and transaction monitoring are policy-driven and default deny.
      - xMoney orders refunds and signed webhooks are idempotent and reconcile separately from direct wallet transfers.
    evidence_required: [alias_resolution_proof, payment_state_machine, recipient_confirmation_e2e, reconciliation_and_privacy_scan]

  - task_id: NX-PAY-P01
    record_kind: task_packet
    parent_epic: NX-PAY-001
    lane: P1_DEMO_CRITICAL
    milestone_order: 1
    title: One stablecoin transfer to a username on devnet
    objective: Two synthetic users resolve one username and complete one capped zero-real-value devnet transfer while a local xMoney sandbox adapter proves order and webhook reconciliation without external credentials.
    owner_agent: A21
    peer_reviewers: [A11, A13, A20]
    control_reviewers: [C02, C03, C05, C10]
    status: done
    risk_class: T0
    timebox_agent_days: 3
    normative_refs: [docs/02-smart-contracts.md, docs/10-supernova-economics-compliance.md, docs/19-username-payments.md]
    depends_on: [NX-ECON-P01, NX-AUTH-001, NX-CHAIN-001, NX-CHAIN-002, NX-OBS-001]
    acceptance_tests:
      - A signed resolution receipt binds username alias version receiver network token amount and short expiry.
      - One test ESDT transfer reaches EXECUTED_SUCCESS and exact indexed balance effects without real value.
      - Alias change after preview stale quote wrong decimals and duplicate submit are denied.
      - Forged duplicate delayed and out-of-order xMoney webhook fixtures converge without double credit.
    evidence_required: [resolution_receipt, devnet_test_transaction, reducer_reconciliation, negative_recipient_tests]

  - task_id: NX-ADULT-001
    record_kind: epic
    lane: P1_POST_DEMO_PROOF
    milestone_order: 11
    child_packets: [NX-ADULT-P01]
    title: Nexus Privé consent-first adult creator network
    objective: Adults can publish and subscribe to lawful mature content on a separately gated web surface without exposing sensitive identity, content or subscription graphs on-chain.
    owner_agent: A43
    peer_reviewers: [A11, A32, A40]
    control_reviewers: [C02, C04, C05, C06, C08]
    status: done
    risk_class: T0
    timebox_agent_days: null
    normative_refs: [docs/04-security-compliance.md, docs/18-creator-node-adult-economy.md]
    depends_on: [NX-ECON-001, NX-AUTH-001, NX-MEDIA-001, NX-MOD-001, NX-CHAIN-001, NX-CHAIN-002]
    acceptance_tests:
      - Viewer and every depicted performer are age and identity verified before access or publication.
      - Per-asset consent rights territory and takedown state fail closed and explicit media never enters public IPFS or mobile-store catalogs.
      - On-chain payloads expose no content title thumbnail identity viewer graph or predictable private target.
      - The age-gated web surface supports free discovery plus subscription PPV tip bundle paid live and metered one-to-one call offers without leaking explicit previews into Nexus Core.
      - Creator payouts remain dominant and transparent while referrals are funded only from Nexus net fees or marketing budget after qualified non-synthetic cross-module activation.
    evidence_required: [age_and_consent_e2e, prepublication_moderation, privacy_payload_scan, country_pack_and_payment_gate]

  - task_id: NX-ADULT-P01
    record_kind: task_packet
    parent_epic: NX-ADULT-001
    lane: P1_POST_DEMO_PROOF
    milestone_order: 11
    title: Privé age consent entitlement and opaque-settlement proof
    objective: One fully synthetic adult asset passes age and consent gates, grants a private entitlement and settles without public sensitive metadata.
    owner_agent: A43
    peer_reviewers: [A11, A32, A40]
    control_reviewers: [C02, C04, C05, C06, C08]
    status: done
    risk_class: T0
    timebox_agent_days: 3
    normative_refs: [docs/04-security-compliance.md, docs/18-creator-node-adult-economy.md]
    depends_on: [NX-ECON-P01, NX-AUTH-001, NX-MEDIA-001, NX-MOD-P01, NX-CHAIN-001, NX-CHAIN-002]
    acceptance_tests:
      - Missing age identity performer consent rights or territory proof denies publication and purchase.
      - Ciphertext purge revokes discovery and keys while preserving only the minimum lawful evidence.
      - Settlement commitment is unlinkable to explicit content and exact liabilities reconcile.
      - Free discovery remains 18+ gated and a paid live or one-to-one call requires a visible rate timer preauthorized cap and signed metering receipts.
      - SYSTEM_TEST referrals paid followers fake users and multi-level recruitment create zero payout organic reach or product adoption credit.
    evidence_required: [synthetic_entitlement_e2e, consent_matrix, purge_receipt, settlement_reconciliation, privacy_scan]

