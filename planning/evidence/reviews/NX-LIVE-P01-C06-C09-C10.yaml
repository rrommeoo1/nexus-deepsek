findings:
  - id: C06-LIVE-P01-001
    severity: HIGH
    status: CLOSED
    title: Eligibility did not bind the complete approved live start
    closure_evidence:
      - LiveEligibility now carries provider, manifest, moderation policy, audience, delay and exact start issued/expiry fields plus creator generation and policy.
      - eligibilityMatches compares every material field before provider invocation.
      - Coordinated signed substitution is denied with zero provider calls, projection, event and replay mutation.

  - id: C09-LIVE-P01-002
    severity: HIGH
    status: CLOSED
    title: Provider receipt did not authenticate the complete fenced operation
    closure_evidence:
      - ProviderOperation carries kind, id, session, fence, manifest, audience and canonical SHA-256 operationDigest.
      - ProviderReceipt exact-parses and binds the entire operation, expected status, provider authority key and signature through verifyReceipt.
      - Exact receipt and operation digest are embedded in ordered event lineage and independently reverified during restore.
      - Wrong manifest and the other stale, late, kind/id/session/fence/audience/digest/status substitutions fail closed.

  - id: C09-LIVE-P01-003
    severity: CRITICAL
    status: CLOSED
    title: Local fail-closed transitions could leave the managed provider live
    closure_evidence:
      - Start timeout, invalid receipt and post-provider creator conflict invoke an idempotent COMPENSATE operation at a higher fence.
      - Stateful provider tests confirm ENDED and prove a late lower-fence start callback cannot resurrect the stream.
      - Emergency failure, timeout or moderator race is represented as CONTAINMENT_PENDING rather than a false terminal claim.
      - Pending state, every attempt and fence are persisted in SHA-256 lineage and durable checkpoint state; fresh restore can retry with a higher fence to authenticated ENDED.
      - Retry is serialized by state, repeated/concurrent calls cannot create multiple active winners, and provider termination is confirmed before FAILED_CLOSED.

accepted_controls:
  - All twenty-one artifacts and the subject are cryptographically bound to owner evidence.
  - All three former findings, including the CRITICAL provider divergence finding, are closed with stateful fake-provider tests and independent source confirmation.
  - Kids denial, moderator CAS, chat-first containment, replay VOD gate, command replay, durable restore and SHA-256 lineage controls pass.
  - No raw secrets, PII or URLs are exposed by the reviewed runtime models.
  - Zero network, provider, economic, real-fund or incremental-cost effects occurred.

