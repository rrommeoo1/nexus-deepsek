control_assessment:
  artifact_and_subject_binding:
    status: PASS
    evidence: The owner Evidence Pack SHA-256 matches FINAL02, all twenty-three current artifact hashes match, and the sorted path-hash subject independently recomputes to the expected digest.
  immutable_evidence_authority_independence:
    status: PASS
    evidence: A signed registry binds four distinct roles to unique key IDs, public-key fingerprints, authority lineages and administrative domains; runtime validation also excludes co-location with the registry authority and checks activation, expiry and revocation fail-closed.
  immutable_evidence_exact_binding:
    status: PASS
    evidence: The attestation is signed by the registered evidence root and binds registry version, fingerprint, content, category, attestation hash, observation time and expiry; evaluation and restore reject rogue or substituted evidence.
  probabilistic_detector_safety:
    status: PASS
    evidence: One probabilistic detector can only label, independent high votes can only hold, and final immutable blocking requires verified evidence from the independent allowlisted path.
  political_neutrality:
    status: PASS
    evidence: Viewpoint-equivalent inputs produce equal outcomes, the decision state has no ideology branch or score, and policy parsing forbids opinion inference and sensitive political targeting.
  causality_and_expiry:
    status: PASS
    evidence: Content creation, signal assessment, evidence observation, model activation, policy activation, decision time and all expiries are ordered fail-closed, with the receipt expiring no later than policy, signals, model manifest or immutable evidence.
  policy_head_and_rollback:
    status: PASS
    evidence: Per-country heads reject lower versions and same-version alternate commitments; only an exact, separately signed, expiring and one-time rollback can move backward, and restore reconstructs both the head and consumed authorization state.
  model_head_and_rollback:
    status: PASS
    evidence: Signed manifests are registry-root, country, surface and purpose bound; per-scope heads reject unknown, lower or same-version-alternate state, exact rollback is one-time, and restore reconstructs model heads and rollback consumption.
  replay_shape_normalization_and_atomicity:
    status: PASS
    evidence: Content generation is the one-time decision key regardless of policy or model substitution, concurrent duplicates serialize, exact shapes and booleans are strict, normalized signed structures are stable, and all durable state mutation occurs after validation and receipt construction.
  snapshot_and_receipt_lineage:
    status: PASS
    evidence: Snapshot input is captured before await, registry and checkpoint signatures are verified, each event is re-evaluated in ordinal order, receipt previous-hash lineage and event hashes must reproduce exactly, and prefix, reorder, fabrication, registry substitution and TOCTOU cases fail closed.
  zero_effects:
    status: PASS
    evidence: Static capability screening and the C06 run show zero credential-name matches, network, provider, economic, organic, real-fund and incremental-cost effects for SYSTEM_TEST actors.

findings:
  - id: C06-TRUST-P01-001
    severity: HIGH
    risk_gate: T0
    status: CLOSED
    title: Immutable evidence authority independence is now enforced by a signed, role-separated trust-root registry.
    closure_locations:
      - packages/trust-lens/api/index.ts:23
      - packages/trust-lens/api/index.ts:128
      - packages/trust-lens/api/index.ts:324
      - packages/trust-lens/api/index.ts:369
      - packages/trust-lens/api/index.ts:393
    closure_evidence:
      - Registry parsing rejects duplicate key IDs, fingerprints, lineages and administrative domains.
      - Runtime registry validation binds every supplied authority to its role and rejects inactive roots and co-location with the registry authority.
      - Independent collision probes deny same key ID, same fingerprint under different IDs, lineage collision, administrative-domain collision and revoked roots.
      - Evaluation and restore revalidate registry signatures, root bindings and evidence authority fingerprints.

  - id: C06-TRUST-P01-002
    severity: HIGH
    risk_gate: T0
    status: CLOSED
    title: Country policy heads now reject rollback and same-version equivocation unless an exact one-time rollback is authorized.
    closure_locations:
      - packages/trust-lens/api/index.ts:37
      - packages/trust-lens/api/index.ts:309
      - packages/trust-lens/api/index.ts:338
      - packages/trust-lens/api/index.ts:375
      - packages/trust-lens/api/index.ts:401
    closure_evidence:
      - Policy state is keyed per country and compares policy ID, version and full signed commitment.
      - Lower versions and same-version alternate commitments are rejected without a matching rollback authorization.
      - Rollback authorization binds the exact scope and from/to IDs, versions and commitments, plus trust registry, authority fingerprint, time window and nonce.
      - Authorization ID and scoped nonce are consumed once; event replay during restore reconstructs heads and consumption before new decisions.
      - Owner and C06 runs prove unauthorized v2-to-v1 denial, equivocation denial, exact authorized rollback, replay denial and post-restore denial.

  - id: C06-TRUST-P01-003
    severity: HIGH
    risk_gate: T0
    status: CLOSED
    title: Model sets now use signed scoped manifests, monotonic heads and exact one-time rollback controls.
    closure_locations:
      - packages/trust-lens/api/index.ts:31
      - packages/trust-lens/api/index.ts:140
      - packages/trust-lens/api/index.ts:234
      - packages/trust-lens/api/index.ts:310
      - packages/trust-lens/api/index.ts:362
      - packages/trust-lens/api/index.ts:373
    closure_evidence:
      - The registered model authority signs an exact manifest containing identity, version, model commitment, purpose, country, surface, validity window, registry version and authority fingerprint.
      - Per-country-surface-purpose heads reject lower versions and same-version different commitments; an unknown or rogue manifest fails signature or root binding.
      - Content ID and generation form the replay key, so changing the model or policy cannot reevaluate the same generation.
      - Exact model rollback is separately authorized, consumed once and reconstructed from signed event history on restore.
      - Owner and C06 runs prove model rollback, equivocation, same-content substitution and post-restore rollback replay are denied.

