findings:
  - id: C04-SOCIAL-P01-001
    severity: HIGH
    status: CLOSED
    title: Like eligibility is atomically closed over exact action policy state and prepared-action lifecycle
    closure_evidence:
      - LikeExecutionAuthorization now includes a signed policyVersion in addition to all exact action actor capability nonce payload domain expiry clip and media bindings.
      - ClipEngagementPolicyBoundary is queried before and after asynchronous preparation and exact version blocked audienceAllowed and deviceActive values must match the signed decision.
      - Profile media policy and purge mutations during prepare return CLIP_EXECUTION_STATE_CONFLICT and emit zero actions.
      - LikeActionRecorder exposes abortPreparedAction and SocialClipRegistry invokes it on every exception after preparation.
      - NexusActionsSandbox removes aborted tokens from its WeakSet; retained references after denial or failed commit return PREPARED_ACTION_INVALID without consuming capability state.
      - A failed commit does not consume decision or authorization and the same valid authorization can be retried successfully.
      - Concurrent same-authorization execution creates exactly one action; the losing execution is rejected and both resolved tokens are unusable afterward.
      - Successful authorization remains one-time and exact target plus reducer terminal and reconciliation regressions pass.

