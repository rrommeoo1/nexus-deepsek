findings:
  - id: C02-UX-P01-001
    severity: MEDIUM
    risk_gate: T1
    status: OPEN
    classification: readability_and_semantic_accessibility
    title: Essential text is rendered below a practical readable size and interactive overlays lack dialog/tab semantics.
    finding: >-
      Static inspection finds 127 font-size declarations below 10px, with a minimum of 6px.
      This includes profile/privacy details, inbox mode badges, Market verification text,
      Dating safety text and other decision-relevant labels. The composer, launcher, support
      modal and payment sheet are visual overlays but expose no role=dialog or aria-modal;
      tab and toggle groups expose no aria-selected or aria-pressed state. Several icon-only
      close/back controls rely on symbols such as × rather than a descriptive accessible name.
      ESLint passing does not establish keyboard focus containment, Escape handling, focus
      restoration or announced selected state.
    closure_conditions:
      - Establish readable type tokens and remove essential text below 12px on the 430px phone/mobile layout; preserve 200% text zoom without clipping, overlap or loss of controls.
      - Give composer, launcher, support and send overlays labelled dialog semantics, initial focus, focus containment, Escape close and focus restoration.
      - Add tablist/tab or pressed-state semantics to lenses, content tabs, inbox filters, scopes, categories and reaction choices; give every icon-only action a descriptive accessible name.
      - Add deterministic keyboard and rendered-accessibility regressions for all five profile modes at mobile and desktop widths.

  - id: C02-UX-P01-002
    severity: MEDIUM
    risk_gate: T1
    status: OPEN
    classification: simulated_claims_not_persistently_disclosed
    title: Production-like trust claims remain visible when the general demo disclosure is hidden on mobile.
    finding: >-
      The UI renders ON-CHAIN CONFIRMED, Action proof, Trust Lens source/AI claims, Identity
      checked and Verified/Escrow labels, plus production-like balances and earnings. The only
      general statement that providers are not connected is inside infoPanel, which the mobile
      media query hides. Composer, support/payment and Privé actions are truthfully labelled,
      but primary Social, Dating and Market surfaces can therefore look like real verification,
      chain confirmation or escrow state despite the Evidence Pack proving zero provider,
      upload, chain and economic effects.
    closure_conditions:
      - Add a persistent, readable mobile and desktop disclosure stating Local interactive demo, synthetic data, no provider connection and zero real funds.
      - Prefix or visually mark every simulated chain proof, Trust Lens result/source count, identity check, seller verification, escrow state, balance, earnings and audience metric as Demo or Synthetic.
      - Replace ON-CHAIN CONFIRMED with a truthful simulated-state label unless an actual bound local/devnet receipt is present and visibly identified by environment.
      - Add rendered regressions for Social, Market, Dating, Creator, Pay and Privé proving the disclosure remains visible at mobile width and that no unqualified production-state claim is emitted.

