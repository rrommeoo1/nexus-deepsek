findings:
  - id: C09-OBS-001-001
    severity: HIGH
    status: CLOSED
    title: Raw identifiers can be persisted through allowlisted telemetry attributes
    requirement: planning/backlog-p0.yaml requires traces without secrets or PII and operational-baseline.v1.json sets rawIdentifiersAllowed_false
    original_evidence:
      source: packages/observability/api/index.ts
      detail: the prior subject validated only attribute key and SAFE_VALUE shape and did not invoke scanTelemetryForPrivateData before storing the span
      independent_reproduction: operation accepted and stored erd1 plus 58 lowercase characters; post-ingest scanner then returned $telemetry.spans[0].attributes.operation:forbidden_value
    impact: a caller can persist a raw wallet or another scanner-detectable identifier under an allowed key, contradicting the fail-closed privacy contract and making the privacy_log_scan receipt insufficient
    remediation: enforce private-data scanning or equivalent value-specific denial before any normal or high-cardinality attribute is appended, add negative tests for wallet IP token and other forbidden values under allowed keys, and make the validator require those ingest-time rejection tests
    closure_evidence:
      source: packages/observability/api/index.ts
      ingest_control: validateAttributes invokes scanTelemetryForPrivateData before assigning each allowed attribute and throws ATTRIBUTE_PRIVATE_DATA_FORBIDDEN on any finding
      fixtures: wallet erd1 IP 203.0.113.7 and JWT under allowed keys
      independent_reproduction: all three attacks returned ATTRIBUTE_PRIVATE_DATA_FORBIDDEN with zero persisted spans and zero persisted audit records
      owner_run: NX-OBS-001-20260803T063314132Z-d6b6932d_PASS_109_OF_109_AND_54_SCENARIOS
      independent_run: NX-OBS-001-C09-20260803-FINALRETEST01_PASS_109_OF_109_AND_54_SCENARIOS

