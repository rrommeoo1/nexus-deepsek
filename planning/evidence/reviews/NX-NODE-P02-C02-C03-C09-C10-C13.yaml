product_quality_assessment:
  ordinary_data_consistency:
    status: PASS
    evidence:
      - Fixtures cover every N from 1 through 8 and independently reproduce the same complete projection for a same-input twin.
      - Replica counts are exactly 1, 2, 3, 3, 3, 3, 3, 3, implementing R=min(eligibleNodes,3).
      - Sequential growth from one to eight nodes updates the target before repair, then converges each object to the target with a common catalog root.
  node_availability_and_repair:
    status: PASS
    evidence:
      - Taking an assigned holder offline exposes UNDER_REPLICATED with two online replicas before any repair.
      - Repair excludes the offline holder, restores three online replicas and converges; bringing the node back does not regress availability.
      - Concurrent repairs serialize and an idempotent second repair emits no duplicate receipts.
  snapshot_save_and_load:
    status: PASS
    evidence:
      - Exported state restores into a fresh instance with byte-for-byte equal projection, catalog root and receipt head.
      - The restored instance continues the signed receipt lineage and denies historical command replay.
      - Restore captures one immutable input representation before its first asynchronous suspension and rejects a stale expected checkpoint.
  receipt_history_and_ordering:
    status: PASS
    evidence:
      - Restore enforces consecutive ordinals, previous-hash chaining, receipt hashes, signatures and nondecreasing placement epochs.
      - Each receipt is bound to an existing node and object, the value commitment, the catalog root at its epoch, and a valid ASSIGN/RELEASE state transition.
      - A prefix, reorder, full history strip, replay, fabricated release and incomplete per-object history are all denied.
  atomicity_and_determinism:
    status: PASS
    evidence:
      - All three independent scenario runs produced identical output and each reported 122 assertions.
      - Injected receipt-signing failure during publish rolls back the epoch, object, replay index and receipts.
      - Injected mid-repair failure rolls back all staged assignments, releases and receipts; the same repair succeeds after recovery.
  zero_external_and_economic_effects:
    status: PASS
    evidence:
      - Static capability screening found no runtime network or child-process path in the mesh source.
      - The independent validator observed zero matching production credential names and records zero network, provider, economic, real-fund and incremental-cost effects.
      - SYSTEM_TEST actors accrue zero rewards and contribute zero organic events.

prior_observations:
  - id: PRIOR-NODE-P02-001
    severity: HIGH
    status: CLOSED
    title: A coordinated removal of all receipts and replica assignments could erase object history.
    closure_locations:
      - packages/node-network/mesh/index.ts:539
      - packages/node-network/mesh/index.ts:564
      - packages/node-network/mesh/index.test.ts:176
    closure_evidence:
      - Restore now maintains a per-object receipt count and rejects any object with an empty receipt history.
      - The dedicated full-strip regression removes every receipt and replica, reseals the snapshot and receives MESH_RECEIPT_RECONCILIATION_FAILED.
      - Independent C13 output reports nonempty_object_history=true and receipt_full_strip=true.
  - id: PRIOR-NODE-P02-002
    severity: HIGH
    status: CLOSED
    title: A receipt could be moved to an epoch before its node joined or its object was published.
    closure_locations:
      - packages/node-network/mesh/index.ts:541
      - packages/node-network/mesh/index.ts:547
      - packages/node-network/mesh/index.test.ts:182
      - packages/node-network/mesh/index.test.ts:188
    closure_evidence:
      - Restore enforces nondecreasing receipt epochs and requires placementEpoch to be at least joinedAtEpoch and publishedAtEpoch.
      - Dedicated node-before-join and object-before-publication regressions both receive MESH_RECEIPT_CAUSALITY_INVALID.
      - Independent C13 output reports causal_epoch_order=true, receipt_node_causality=true and receipt_object_causality=true.

