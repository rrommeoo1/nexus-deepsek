findings:
  - id: C03-CHAIN-001-RP-001
    severity: HIGH
    status: OPEN
    title: Execute approval guard accepts an unregistered and unbound identifier
    location: planning/run-chain-devnet.ps1:172
    evidence: The guard checks only AllowPublicDevnetPayload plus a regex-shaped ApprovalId. It does not resolve an immutable approval record, verify owner or expiry, or bind approval to gateway, environment, current subject_sha256, WASM hash, action count, and zero-value policy.
    impact: A caller able to supply the switch can invent a syntactically valid identifier and reach public bytecode transmission without evidence of the required explicit owner authorization.
    remediation: Require a repository approval receipt with owner, issued_at, expires_at, environment=devnet, gateway, approved subject and WASM hashes, maximum four transactions, zero real value, and single-use status; validate it before the first network-capable call and record its digest in final evidence.
  - id: C03-CHAIN-001-RP-002
    severity: HIGH
    status: OPEN
    title: Capability query command is incompatible with pinned mxpy 11.4.1
    location: planning/run-chain-devnet.ps1:245
    evidence: The current runner hash 1eee01c6fb08df4d4a30b7ed3d5138aa8400eadd29fe18b1d37801383309ee2b still invokes mxpy contract query with --outfile. The independently inspected pinned mxpy 11.4.1 query help has no --outfile option, and its implementation writes the result to stdout.
    impact: Execute would fail after deploy, relayer authorization, capability registration, and recordAction have already produced public Devnet transactions, preventing the promised capability-state proof and final Evidence Pack.
    remediation: Capture and parse Invoke-Mxpy stdout for contract query, or use a supported API; add a local CLI-parse test for every future Execute command before allowing network access.
  - id: C03-CHAIN-001-RP-003
    severity: MEDIUM
    status: OPEN
    title: Query-state validation does not decode the expected capability state
    location: planning/run-chain-devnet.ps1:248-250
    evidence: The current runner safely reads return_code and return_data_parts, but tests only that the return list is nonempty. It does not decode schema_version, active, used_actions=1, last_action_nonce=1, controller, actor kind, scope, expiry, or authorized relayer.
    impact: Once command capture is repaired, malformed or unrelated query output could be treated as proof of the intended state transition.
    remediation: Parse the pinned mxpy query result shape, decode SessionCapability using the staged ABI, assert every expected field, and hash-bind the decoded state receipt.
  - id: C03-CHAIN-001-RP-004
    severity: MEDIUM
    status: OPEN
    title: Offline preflight does not exercise negative approval cases or parse all Execute commands
    location: planning/run-chain-devnet.ps1:137-163
    evidence: Prepare reports execute_requires_allow_switch and execute_requires_approval_id as declared booleans; it does not test rejection of missing, forged, expired, mismatched, or reused approvals and did not detect the unsupported query option.
    impact: READY status overstates runner readiness and allows command-surface regressions to survive until after public transactions begin.
    remediation: Add a network-disabled command-plan builder and tests for all argument vectors plus fail-closed approval mutations, with a guarantee that no command capable of egress is invoked during preflight.

