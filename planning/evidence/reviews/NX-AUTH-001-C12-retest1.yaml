finding_disposition:
  - id: C12-AUTH-001
    prior_severity: CRITICAL
    status: CLOSED
    evidence: >-
      claimLoginChallenge synchronously marks consumed before the first await.
      Promise.allSettled coverage demonstrates exactly one successful completion,
      one STATE_REPLAY, and one provider-verifier invocation.
  - id: C12-AUTH-002
    prior_severity: HIGH
    status: OPEN
    evidence: >-
      Purpose, action/case, nonce, expiry, keyVersion, publicRef, and verifierDomain
      binding are present; duplicate publicRef/domain and single-challenge replay deny.
      A remaining multi-challenge race exists: beginRecovery permits multiple active
      cases for one RECOVERING wallet. Two proof challenges can both carry keyVersion N;
      claimProofChallenge can synchronously accept both before either asynchronous
      factor verification finishes. completeRecovery does not recompare/version-CAS
      before its unconditional keyVersion increment, so both recoveries can succeed.
    required_change: >-
      Permit only one active recovery per wallet or atomically compare-and-swap the
      wallet keyVersion/recovery state at completion. Add a Promise.all test with two
      cases/challenges for the same keyVersion and require exactly one completion.
  - id: C12-AUTH-003
    prior_severity: HIGH
    status: CLOSED_FOR_SANDBOX
    evidence: >-
      A repository boundary and export/restore snapshot preserve consumed login state,
      identity revocation, wallet state, recovery/proof challenges, and used entropy.
      Restart tests deny login replay and revoked identity reuse. The production
      transactional adapter remains explicitly excluded and externally gated.
  - id: C12-AUTH-004
    prior_severity: HIGH
    status: CLOSED
    evidence: >-
      Owner and C12 runs use the same stable subject digest. Mutable backlog, scorecard,
      and checkpoint hashes are separated as operational provenance and do not alter it.
  - id: C12-AUTH-005
    prior_severity: MEDIUM
    status: CLOSED_FOR_SANDBOX
    evidence: >-
      Runtime allowlisting rejects unknown wallet providers and invalid keyVersion values.
      Production wallet cryptography, independent audit, and legal custody opinion remain
      explicitly excluded/open rather than being claimed by this sandbox.

blocking_findings:
  - id: C12-AUTH-002
    severity: HIGH
    classification: recovery_concurrency_and_key_version
    title: Parallel recovery challenges can both commit against one key version.
    code_evidence:
      multiple_active_case_guard_present: false
      claim_version_check: 'challenge.keyVersion !== keyVersion'
      asynchronous_gap: 'await factorVerifier.verify(...)'
      completion_version_CAS_present: false
      completion_update: 'wallet.keyVersion += 1'
    missing_test: parallel recovery cases and proof challenges on the same wallet/keyVersion

