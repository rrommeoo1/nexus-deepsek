    severity: HIGH
    status: CLOSED
    title: verifyResolution accepts forged or stale PaymentAuthorization objects
    closure_evidence:
      - PaymentAuthorization now embeds the full signed PaymentCapability rather than a caller-provided signature label alone.
      - verifyResolution recomputes authorizePayment at the resolution time through PaymentCapabilityVerifier.
      - country substitution is rejected with AUTHORIZATION_BINDING_MISMATCH.
      - capability signature substitution is rejected with PAYMENT_CAPABILITY_SIGNATURE_INVALID.
      - stale authorizedAt and expired capability paths fail closed.

  - id: C03-PAY-P01-002
    severity: HIGH
    status: CLOSED
    title: DirectPaymentLedger restore permits fabricated finality and phantom event history
    closure_evidence:
      - Direct events persist ordinal failure data typed ChainObservation and a fingerprint bound to the complete receipt and observation.
      - Restore deterministically replays every ordinal and compares the derived state tx hash and failure code with the stored record.
      - EXECUTED_SUCCESS requires the persisted observation to satisfy exact balance invariants and a ChainObservationVerifier at runtime and restore.
      - Missing events phantom ordinals altered fingerprints absent observation verifier denial and final-state substitution are rejected.
      - Event replay remains denied after authentic snapshot restore.

  - id: C03-PAY-P01-003
    severity: HIGH
    status: CLOSED
    title: LocalXMoneyReconciler restore permits order overwrite and fabricated provider history
    closure_evidence:
      - Restore parses canonical XMONEY:ORDER:n identifiers and requires a unique contiguous sequence whose maximum equals the persisted sequence.
      - Typed webhook events retain order state time signature and recomputed fingerprint and are reverified during restore.
      - Facts state credited and creditedEver are reconstructed and compared from the signed event set.
      - Sequence rollback missing events fabricated facts phantom orders and verifier denial are rejected.
      - An authentic restart preserves webhook replay denial without duplicate credit.

