findings:
  - id: C03-CHAIN-001-001
    severity: HIGH
    status: OPEN
    title: Mandatory fuzz corpus is absent
    requirement: planning/backlog-p0.yaml evidence_required.fuzz_corpus and docs/02-smart-contracts.md property/fuzz requirement
    evidence: Repository search found deterministic example tests but no NX-CHAIN-001 property/fuzz corpus, seed, run receipt, or replayable failures.
    impact: Boundary combinations for nonce, TTL, expiry, rotation limits, scopes, and relayer state are not demonstrated for this T0 gate.
    remediation: Add a bounded deterministic property/fuzz corpus with fixed seeds, replay artifacts, mutation oracles, and an Evidence Pack tied to the current source and WASM hashes.
  - id: C03-CHAIN-001-002
    severity: HIGH
    status: OPEN
    title: Shared RustVM-GoVM differential set does not cover all mandatory abuse cases
    requirement: backlog acceptance requires nonce replay, capability escalation, batching, and relayer mutation failures plus critical VM agreement
    evidence: The four shared scenarios cover replay, private scope denial, private success, and pause; capability escalation, batching, revoke/rotate, and relayer mutation are not all executed by both VMs.
    impact: VM-specific decoding or state-transition differences in mandatory T0 rejection paths remain untested.
    remediation: Add portable shared scenarios for capability escalation, relayer mutation, revoke/rotate, and malformed or batch-shaped invocation where representable, then require identical RustVM and GoVM outcomes.
  - id: C03-CHAIN-001-003
    severity: HIGH
    status: OPEN
    title: Devnet record proof and terminal network execution evidence are missing
    requirement: NX-CHAIN-001 title and objective require an action transaction and terminal execution proof on devnet
    evidence: All current runs are local; canonical packs explicitly exclude devnet_transaction.
    impact: Relayer broadcast, network transaction encoding, shard inclusion, finality, and executed-success reconciliation are not proven end to end.
    remediation: Run a zero-real-funds devnet action through the intended relayer and capture tx hash, ordered/included/finalized/executed states, event, and reconciliation receipt without expanding claims to mainnet.

accepted_controls:
  - Rust 1.88.0 and multiversx-sc 0.66.2 locked build is reproducible.
  - Real VM Ed25519 verification is imported and exercised.
  - Current WASM, MXSC, v1 ABI, and staged v2 ABI hashes are fresh.
  - Four shared scenarios pass identically in RustVM and GoVM 1.5.
  - Actual GoVM gas snapshots exclude expected rejections from success budgets.
  - PII/private plaintext scans found no prohibited payload content in the tested fixtures.
  - Endpoints are nonpayable and encode one action envelope per call.

