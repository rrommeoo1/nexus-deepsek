closure_conditions:
  - Close C03-CHAIN-001-001 with hash-bound deterministic fuzz evidence.
  - Close C03-CHAIN-001-002 with expanded RustVM-GoVM differential scenarios.
  - Close C03-CHAIN-001-003 with a devnet terminal execution and reconciliation receipt.
  - Re-run C03 against the remediated immutable subject before changing packet status to done.
