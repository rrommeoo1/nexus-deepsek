    severity: MEDIUM
    status: CLOSED
    title: Checkpoint generation covers duplicate and ignored-observation counters
    closure_evidence:
      implementation: both duplicate and non-final ingest branches increment generation when their checkpointed counters change
      regressions: deferred-hasher duplicate and non-final interleavings each produce CHECKPOINT_CONCURRENT_MUTATION

