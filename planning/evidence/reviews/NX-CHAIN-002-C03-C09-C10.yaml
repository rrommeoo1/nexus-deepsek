    severity: HIGH
    status: CLOSED
    title: Repair authorization is authenticated and durably single-use across restart
    closure_evidence:
      authorization: the injected verifier binds approval identity subject event set roles quorum evidence and validity window
      persistence: ReducerRepairCommit has a unique approvalId and stores subject set and evidence hashes plus replacement observations
      ordering: commitRepairAtomically completes before any in-memory event replacement or return to NORMAL mode
      regressions: forgery subject drift wrong event set expiry same-instance replay and fresh-instance replay are denied

