control_assessment:
  artifact_and_subject_binding:
    status: PASS
    evidence: All twenty-one current artifact hashes match owner evidence, evidence SHA matches the assigned receipt, and the expected review subject was independently recomputed exactly.
  independent_validation:
    status: PASS
    evidence: The C13 validator passed 151 controls and 46 scenario assertions in each of three deterministic repetitions on the bound FINAL02 subject.
  c09_atomic_backup_closure:
    status: PASS
    evidence: GenesisBackupStore.commit captures one canonical JSON representation before its first await, validates that captured plain object, and uses only the captured checkpoint and serialized bytes for key selection, conflict comparison, storage and receipt construction.
  caller_mutation_isolation:
    status: PASS
    evidence: Independent reproduction changed checkpointHash, stateRoot and a nested event immediately after commit returned its pending promise; the receipt and stored snapshot retained the original verified values, the attacker-selected hash was absent, and the stored snapshot restored successfully.
  getter_proxy_and_repeated_read_isolation:
    status: PASS
    evidence: An exact-shaped root proxy with a nested event proxy returned corrupt alternatives on any repeated read; every own root and nested event property was read exactly once, the commit succeeded for the original representation, and its stored bytes restored to the original state root.
  stored_bytes_and_receipt_binding:
    status: PASS
    evidence: The stored checkpoint restored successfully and its hash, state root, event head and event count matched the receipt; receipt byteLength equaled the UTF-8 length of the stored canonical representation.
  append_export_dispose_concurrency:
    status: PASS
    evidence: Independent regression queued four appends, export, four appends and dispose; ordinals were exactly 1 through 8, export ended at ordinal 4, dispose cleared 8, and the subsequent projection failed GENESIS_NODE_DISPOSED.
  restore_replay_identity_and_chaining:
    status: PASS
    evidence: Fresh restore preserved state and history, historical event replay failed GENESIS_EVENT_REPLAY, checkpoint two required checkpoint one's hash, and stale restore without that expected predecessor failed GENESIS_CHECKPOINT_STALE; validator negative cases reconfirmed lineage, identity and authority denials.
  exact_shape_and_zero_effects:
    status: PASS
    evidence: Exact-shape regressions pass, source contains no detected network or process capability, credential matches are zero, and validator execution recorded zero network, provider, economic, real-fund and incremental-cost effects.

findings:
  - id: C09-NODE-P01-001
    severity: HIGH
    status: CLOSED
    title: Backup commit stored mutable bytes that were not the checkpoint it validated
    original_location:
      - packages/node-network/api/index.ts:84
      - packages/node-network/api/index.ts:85
    closure_location:
      - packages/node-network/api/index.ts:48
      - packages/node-network/api/index.ts:85
      - packages/node-network/api/index.ts:86
      - packages/node-network/api/index.test.ts:57
      - packages/node-network/api/index.test.ts:63
    closure_evidence:
      - canonicalSnapshot captures and parses one representation before the first asynchronous suspension.
      - commit validates, keys, compares, stores and receipt-binds only the captured representation and never rereads caller-owned input.
      - Deterministic owner tests cover concurrent mutation of checkpointHash, stateRoot and a nested event, confirm the attacker-selected key is absent, and restore the stored bytes.
      - Getter-backed owner coverage proves checkpointHash is captured once; the independent C13 proxy probe additionally proves every root and nested event property is read once.
      - The independent probe proves stored canonical byte length and restored projection match the successful receipt.
      - Validator FINAL02 asserts stable_source_snapshot, stored_restore_verified, receipt_matches_stored_bytes, getter_read_once, backup_concurrent_mutation and backup_getter_snapshot.

