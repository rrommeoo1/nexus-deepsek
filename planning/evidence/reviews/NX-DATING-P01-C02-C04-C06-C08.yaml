findings:
  - id: C02-DATING-P01-001
    severity: HIGH
    status: CLOSED
    title: Current trust state was not revalidated across asynchronous execution
    closure_evidence:
      - DatingTrustBoundary exposes exact current claim, trust version, profile generation, adult, photo, liveness, expiry, revocation and observed time state.
      - Private authorization binds trustClaimId and trustVersion.
      - Trust is exact-validated before and after prepare together with profile and policy CAS.
      - Revoke, replacement, expiry and generation mutation paths abort and leave no event, receipt, authorization or nonce mutation.

  - id: C04-DATING-P01-002
    severity: HIGH
    status: CLOSED
    title: Committed private chain receipt was not fully bound or atomically promoted
    closure_evidence:
      - Expected event binds identifier, actorCommitment, objectCommitment, actionNonce and PRIVATE_ACTION class.
      - commitPreparedActionExact compares the complete expected event to the prepared projection before calling commitPreparedAction.
      - Actor substitution fails PREPARED_ACTION_BINDING_MISMATCH with zero event emission.
      - Injected commit failure creates no event and leaves authorization and nonce safely reusable; receipt/replay promotion occurs only after successful exact commit.

  - id: C04-DATING-P01-003
    severity: HIGH
    status: CLOSED
    title: Private action nonce uniqueness was delegated and lost on restore
    closure_evidence:
      - DatingRegistry persists a nonce key bound to actor profile, generation, session, chain, contract and nonce.
      - Authorization and nonce are checked before prepare and rechecked with head and ordinal during post-prepare CAS.
      - Same authorization concurrency has exactly one winner and a distinct authorization with the same nonce is denied.
      - Restore rebuilds authorization and nonce indexes; fresh-recorder historical nonce reuse is denied before prepare.

  - id: C06-DATING-P01-004
    severity: HIGH
    status: CLOSED
    title: Snapshot restore lacked authenticated receipt lineage independent of checkpoint verifier behavior
    closure_evidence:
      - Each receipt embeds and verifies its exact signed PrivateInteractionAuthorization.
      - Receipt canonicalization binds ordinal, previous hash, authorization, action, actor, commitment, nonce, profile, policy, trust and recorded time under SHA-256.
      - Snapshot head must equal the ordered terminal receipt hash and a durable checkpoint independently binds id, receipt count/head, trust claim/version and policy version.
      - Restore exact-parses and recomputes every receipt and all replay indexes; permissive snapshot-verifier fabrication, prefix, reorder, removal and field substitution fail internal lineage or durable-checkpoint controls.

accepted_controls:
  - All twenty-five artifacts and the subject are cryptographically bound to owner evidence.
  - All four former HIGH findings are closed by deterministic tests, independent validation and source-level confirmation.
  - Adult/trust, privacy, exact-shape, signature, authorization, TOCTOU, prepared-action, exact chain commit, replay, concurrency, durable restore and synthetic-isolation controls pass.
  - Existing NexusActionsSandbox CAS and commitPreparedActionExact regressions remain passing.
  - Zero network, provider, economic, real-fund or incremental-cost effects occurred.

