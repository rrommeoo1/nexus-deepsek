findings:
  - id: C02-CHAT-P01-001
    severity: HIGH
    status: CLOSED
    title: A signed capability can substitute the original message recipient during receipt processing
    closure_evidence:
      - Conversation participant binding is pinned on first accepted event and must remain the immutable unordered A/B pair.
      - Original recipient is retained in internal state derived from the signed SEND but is absent from the public service projection.
      - DELIVER and READ require the receipt actor to equal the original SEND recipient; signed A/C substitutions fail before and after fresh restore.
      - Missing reordered or tampered message lineage fails snapshot validation and deterministic replay reconstruction.

  - id: C02-CHAT-P01-002
    severity: HIGH
    status: CLOSED
    title: Old device and key epoch remain usable after a successful capability rotation
    closure_evidence:
      - Facade rotate requires the exact stored current capability and promotes the next signed capability with exactly one higher epoch and a new device.
      - Old capability plus a still-valid pre-rotation access decision fails CAPABILITY_STALE immediately after rotation and after fresh restore.
      - Duplicate and stale rotations fail CAPABILITY_STALE and gap rotation fails CAPABILITY_ROTATION_INVALID.
      - ROTATE is an ordinal fingerprinted replay event; missing reordered or tampered rotation lineage fails snapshot restoration.

