    evidence: Inputs are canonicalized before actor grouping; contradictory records for one actor are all excluded, identical duplicates collapse deterministically, cluster groups and actor selection are canonically ordered, and seven independent permutation probes produced one output per multiset.
  surface_object_and_profile_binding:
    status: PASS
    evidence: Actor and owner profile types are exact signed command fields, both must match the policy-derived surface type, an exhaustive surface-object matrix is checked before every transition, and restore replays the same checks. Three formerly accepted invalid pairs and actor, owner and snapshot substitutions now fail closed.
  exploration_allocation:
    status: PASS
    evidence: allocateExploration accepts one exact cohort, excludes ineligible, non-organic and quarantined candidates, deterministically orders eligible candidates, reserves ceil(slots times floor) new-content slots when available and reports satisfaction relative to available fresh inventory under candidate shortage.
  fake_opinion_and_dislike_safety:
    status: PASS
    evidence: FAKE_OPINION remains private user sentiment, reaches penalty only through the same organic, cluster, sample and confidence gates, is separated normatively from AI provenance and never emits a factual verdict, direct takedown, reputation or payment decision. Dislike removal remains NEVER_FROM_DISLIKE.
