    status: PASS
    evidence: Signed exact-shape one-time commands, serialized nonces, append-only SHA-256 lineage, separate moderation authority, signed snapshots and exact durable checkpoints preserve creator non-erasure, author tombstones, undo history and deterministic restore.
  zero_effects:
    status: PASS
    evidence: Three independent C02 runs and in-memory probes show zero credential, network, provider, economic, organic, real-fund and incremental-cost effects.

findings:
  - id: C02-ENGAGE-P01-001
    severity: HIGH
    risk_gate: T0
    status: CLOSED
    title: Ranking and duplicate handling are invariant to caller ordering.
    closure_evidence:
      - Parsed impressions are canonically ordered by actor commitment and full canonical record.
      - All contradictory records for one actor are excluded; identical duplicates retain one deterministic record.
      - Cluster selection sorts clusters and actors before enforcing the cap.
      - Owner tests and independent probes over four cluster permutations and three conflicting-duplicate permutations produce one identical output per multiset.

  - id: C02-ENGAGE-P01-002
    severity: HIGH
    risk_gate: T0
    status: CLOSED
    title: Signed profile types and an exhaustive surface-object matrix now enforce mode isolation.
    closure_evidence:
      - actorProfileType and ownerProfileType are exact signed fields and both must equal the policy-derived type for the surface.
      - Every action checks the surface-object matrix before state transition, and snapshot restore replays the same command and transition validation.
      - MARKET/PROFILE, KIDS/JOB and SOCIAL/LESSON are denied.
      - Actor-type and owner-type substitution are denied even with a newly signed command; snapshot event substitution is denied on restore.

  - id: C02-ENGAGE-P01-003
    severity: HIGH
    risk_gate: T0
    status: CLOSED
    title: Exploration is now an explicit deterministic per-cohort inventory allocation.
    closure_evidence:
      - allocateExploration requires one cohort, unique candidates, exact fields and bounded inventory slots.
      - A ten-slot cohort with sufficient fresh candidates reserves and selects one fresh slot, yielding 1000 bps allocation.
      - Reordering candidates does not change the allocation.
      - Paid, AGENT, SYSTEM_TEST, INCENTIVIZED, quarantined and ineligible candidates cannot be selected.
      - Insufficient inventory and insufficient fresh candidates degrade against available candidates without fabricating eligibility.

