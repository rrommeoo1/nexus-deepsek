finding_disposition:
  - id: C12-AUTH-001
    prior_severity: CRITICAL
    status: CLOSED
    evidence: Login challenge is synchronously claimed before the first await; the Promise.allSettled race has one success, one STATE_REPLAY, and one provider call.
  - id: C12-AUTH-002
    prior_severity: HIGH
    status: CLOSED
    evidence: >-
      Two recovery cases and proof challenges issued for the same wallet keyVersion are
      completed with Promise.allSettled. Post-await compare-and-swap requires both
      recovery.state=COOLDOWN and wallet.keyVersion=claimedChallenge.keyVersion.
      Exactly one completion succeeds; the loser is marked CONFLICTED and returns
      RECOVERY_COMMIT_CONFLICT. The winner assigns keyVersion=N+1 rather than performing
      an unconditional increment.
  - id: C12-AUTH-003
    prior_severity: HIGH
    status: CLOSED_FOR_SANDBOX
    evidence: Repository export/restore preserves consumed challenges, revocation, wallet/recovery state, proof challenges, and entropy; production transactional persistence remains excluded and gated.
  - id: C12-AUTH-004
    prior_severity: HIGH
    status: CLOSED
    evidence: Owner and C12 runs bind the same stable subject; mutable operational provenance remains separated.
  - id: C12-AUTH-005
    prior_severity: MEDIUM
    status: CLOSED_FOR_SANDBOX
    evidence: Provider allowlist and positive safe keyVersion are enforced; production cryptography, audit, and legal custody claims remain excluded and gated.

